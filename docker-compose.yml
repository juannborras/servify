services:
  db:
    image: postgres:16
    container_name: servify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Servify}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - servify_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Servify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servify_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-Servify}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SERVIFY_GOOGLE_CLIENT_IDS: ${SERVIFY_GOOGLE_CLIENT_IDS:-}
      SERVIFY_LINKEDIN_CLIENT_IDS: ${SERVIFY_LINKEDIN_CLIENT_IDS:-}
      SERVIFY_TOKEN_SECRET: ${SERVIFY_TOKEN_SECRET:-servify-local-dev-token-secret-change-me-64-characters}
      SERVIFY_ADMIN_EMAIL: ${SERVIFY_ADMIN_EMAIL:-servifycommunity@gmail.com}
      SERVIFY_FRONTEND_URL: ${SERVIFY_FRONTEND_URL:-http://localhost:5173}
      SERVIFY_PASSWORD_RESET_TTL_MINUTES: ${SERVIFY_PASSWORD_RESET_TTL_MINUTES:-30}
      SERVIFY_PASSWORD_RESET_EXPOSE_DEBUG_TOKEN: ${SERVIFY_PASSWORD_RESET_EXPOSE_DEBUG_TOKEN:-false}
      SERVIFY_MAIL_HOST: ${SERVIFY_MAIL_HOST:-}
      SERVIFY_MAIL_PORT: ${SERVIFY_MAIL_PORT:-587}
      SERVIFY_MAIL_USERNAME: ${SERVIFY_MAIL_USERNAME:-}
      SERVIFY_MAIL_PASSWORD: ${SERVIFY_MAIL_PASSWORD:-}
      SERVIFY_MAIL_FROM: ${SERVIFY_MAIL_FROM:-servifycommunity@gmail.com}
      SERVIFY_MAIL_SMTP_AUTH: ${SERVIFY_MAIL_SMTP_AUTH:-true}
      SERVIFY_MAIL_SMTP_STARTTLS: ${SERVIFY_MAIL_SMTP_STARTTLS:-true}
      SERVIFY_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*
    ports:
      - "8082:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SERVIFY_API_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: servify_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  servify_data:
