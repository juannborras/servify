spring.datasource.url=jdbc:h2:mem:servify-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false

servify.auth.external.fake-verifier.enabled=true
servify.password-reset.expose-debug-token=true
servify.password-reset.frontend-url=http://localhost:5173
servify.mercadopago.access-token=
servify.mercadopago.return-url=
servify.mercadopago.notification-url=
servify.mercadopago.webhook-secret=
servify.mercadopago.required=false
